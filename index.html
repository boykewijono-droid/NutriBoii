<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NutriBoii</title>
<meta name="description" content="Daily nutrition, activity and body-composition tracking.">
<meta name="theme-color" content="#E9E4D8">
<script>
/* Pick the theme BEFORE anything paints, so dark mode never flashes light
   first. app.js takes over once it loads. A retired "night" choice still in
   someone's storage falls through to Auto, which is where app.js moves it. */
(function () {
  var m = 'system';
  try { m = localStorage.getItem('nutriboii.theme') || 'system'; } catch (e) {}
  var dark;
  if (m === 'dark') dark = true;
  else if (m === 'light') dark = false;
  else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121210' : '#E9E4D8');
})();
</script>
<!-- Home-screen install. Without a manifest, Android adds a plain browser
     bookmark with a generic icon; with one it opens full-screen like an app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriBoii">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=9adf2cae">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316150F'/%3E%3Crect x='6' y='19' width='20' height='3' fill='%23B4D336'/%3E%3Crect x='6' y='12' width='13' height='3' fill='%23F4F1E8'/%3E%3C/svg%3E">
</head>
<body>

<div class="shell">

  <!-- desktop rail ------------------------------------------------------ -->
  <aside class="rail">
    <div class="brand">
      <b>NutriBoii</b>
      <span id="brandSub">Singapore &middot; SGT</span>
    </div>
    <nav class="nav" id="navRail"></nav>
    <div class="rail-foot">
      <div id="railStamp">&mdash;</div>
      <button type="button" data-act="reconfigure">Sheet settings</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <div class="when" id="pageWhen">&mdash;</div>
      </div>
      <div class="top-actions">
        <div class="sync" id="sync">
          <span class="dot"></span><span id="syncText">Loading&hellip;</span>
          <button type="button" data-act="refresh" hidden id="refreshBtn">Refresh</button>
        </div>
        <button type="button" class="theme-btn" data-act="theme" id="themeBtn" aria-label="Change theme"><i></i><span id="themeText">Auto</span></button>
      </div>
    </header>

    <section class="view on" id="view-today"></section>
    <section class="view"    id="view-week"></section>
    <section class="view"    id="view-trends"></section>
    <section class="view"    id="view-history"></section>
  </main>
</div>

<!-- mobile tab bar ------------------------------------------------------- -->
<nav class="tabbar" id="navTabs"></nav>

<!-- day detail ----------------------------------------------------------- -->
<div class="scrim" id="scrim" data-act="closeDay"></div>
<aside class="sheet" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle" hidden></aside>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script src="assets/config.js?v=9adf2cae"></script>
<script src="assets/app.js?v=9adf2cae"></script>
</body>
</html>
